<div
  class="fixed inset-0 z-50 bg-ink/90 flex items-center justify-center"
  (click)="close()"
>
  <button
    type="button"
    (click)="close()"
    class="absolute top-5 right-5 md:top-8 md:right-8 z-10 text-paper w-10 h-10 flex items-center justify-center border border-paper/40 hover:border-paper transition-colors"
    aria-label="Schliessen"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="4" y1="4" x2="20" y2="20"></line>
      <line x1="20" y1="4" x2="4" y2="20"></line>
    </svg>
  </button>

  <swiper-container
    #swiperEl
    (click)="$event.stopPropagation()"
    class="w-full h-full max-w-[1100px] max-h-[85vh] px-4"
    style="--swiper-navigation-color: #ffffff; --swiper-navigation-size: 22px;"
    init="false"
  >
    @for (src of images(); track src) {
      <swiper-slide class="flex items-center justify-center">
        <img [src]="src" alt="Fotografie von Alex Scheidegger, Grossansicht" class="max-w-full max-h-[85vh] object-contain">
      </swiper-slide>
    }
  </swiper-container>
</div>
