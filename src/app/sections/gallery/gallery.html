<section id="galerie" class="max-w-[1920px] mx-auto px-6 md:px-10 py-16 md:py-20">
  <div class="flex items-baseline justify-between mb-10 flex-wrap gap-3">

  </div>

  <div class="masonry-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-4 md:gap-5 auto-rows-0.25" #grid>
    @for (src of images(); track src; let i = $index) {
      <div class="gallery-tile" (click)="open(i)" #tile>
        <img [src]="src" alt="Fotografie von Alex Scheidegger, Bild {{ i + 1 }} von {{ images().length }}" loading="lazy" (load)="onImageLoad($event)">
        <div class="tile-overlay absolute inset-0 bg-ink/40 flex items-center justify-center">
          <svg class="absolute left-4 bottom-4 text-paper" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="10" cy="10" r="6.5"></circle>
            <line x1="15" y1="15" x2="20.5" y2="20.5"></line>
            <line x1="10" y1="7.5" x2="10" y2="12.5"></line>
            <line x1="7.5" y1="10" x2="12.5" y2="10"></line>
          </svg>
        </div>
      </div>
    }
  </div>
</section>

@if (activeIndex() !== null) {
  <app-lightbox [images]="images()" [activeIndex]="activeIndex()!" (closed)="close()" />
}
