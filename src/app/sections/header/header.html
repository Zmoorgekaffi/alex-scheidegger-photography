<header class="sticky top-0 z-20 w-full bg-paper/90 backdrop-blur-sm border-b border-ink/10">
  <div class="max-w-[1920px] mx-auto px-6 md:px-10 py-4 flex items-center justify-between gap-6">
    <h1 class="sr-only">Alex Scheidegger Photography: Event-, Club- und Businessfotografie aus Luzern</h1>
    <a href="#top" (click)="closeMenu()">
      <img src="logo-bearbeitet.png" alt="Alex Scheidegger Photography Logo" class="h-7 md:h-[5rem] w-auto block">
    </a>

    <nav class="hidden sm:flex items-center gap-6 md:gap-10" aria-label="Hauptmenü">
      <a href="#galerie" class="nav-link">Galerie</a>
      <a routerLink="/ueber-mich" class="nav-link">Über mich</a>
      <a href="#angebote" class="nav-link">Angebote</a>
      <a href="#kontakt" class="nav-link">Kontakt</a>
    </nav>

    <button
      type="button"
      class="sm:hidden w-10 h-10 flex items-center justify-center text-ink cursor-pointer"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuOpen() ? 'Menü schliessen' : 'Menü öffnen'"
      (click)="toggleMenu()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        @if (menuOpen()) {
          <line x1="4" y1="4" x2="20" y2="20"></line>
          <line x1="20" y1="4" x2="4" y2="20"></line>
        } @else {
          <line x1="3" y1="7" x2="21" y2="7"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="17" x2="21" y2="17"></line>
        }
      </svg>
    </button>
  </div>

  <nav
    id="mobile-menu"
    aria-label="Hauptmenü mobil"
    class="sm:hidden grid transition-[grid-template-rows] duration-300 ease-out"
    [class.grid-rows-[1fr]]="menuOpen()"
    [class.grid-rows-[0fr]]="!menuOpen()"
    [attr.inert]="menuOpen() ? null : ''"
  >
    <div class="overflow-hidden">
      <div class="flex flex-col px-6 pb-6 pt-2 border-t border-ink/10" (click)="closeMenu()">
        <a href="#galerie" class="nav-link py-3 border-b border-ink/10">Galerie</a>
        <a routerLink="/ueber-mich" class="nav-link py-3 border-b border-ink/10">Über mich</a>
        <a href="#angebote" class="nav-link py-3 border-b border-ink/10">Angebote</a>
        <a href="#kontakt" class="nav-link py-3">Kontakt</a>
      </div>
    </div>
  </nav>
</header>
